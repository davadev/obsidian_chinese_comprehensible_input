name: Feature request
description: Suggest an improvement that fits the plugin's scope
labels: [enhancement, user-request]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: platform
    attributes:
      label: Where do you read?
      multiple: true
      options: [Desktop, iPhone/iPad, Android, E-ink reader]
