name: Release

# Triggered on push of a SemVer-shaped tag. Bare `0.3.4` ships as the
# `latest` GitHub Release; suffixed `0.3.4-rc.1` / `0.3.4-beta.2` ship as
# prereleases. The whole verification chain (npm ci → lint → build →
# test → check-release with --with-build) runs on a clean Ubuntu runner
# before any release is created — a single lint Error aborts the
# pipeline, so a broken release can never reach the directory.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (Obsidian-parity)
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run release guard
        run: npm run check-release -- --tag "${GITHUB_REF_NAME}" --with-build

      - name: Decide prerelease vs latest
        id: rel
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists for $tag — uploading assets."
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              ${{ steps.rel.outputs.flag }} \
              main.js manifest.json styles.css
          fi
