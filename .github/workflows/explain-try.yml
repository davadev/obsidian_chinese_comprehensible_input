name: Explain try

# Try the Explain note (#186) on real words with the real model, using the plugin's own dictionary, prompts, validation and
# renderer, and publish the Markdown it would save. Start it by hand from the Actions tab; a run costs a few cents.
#
# Same trust model as model-compare.yml: the key is an environment secret of `model-lifecycle`, which only deploys from
# `main`; workflow_dispatch only; the key is visible to one step; inputs reach the script through env. Pinned to full
# commit SHAs, as in ci.yml. CC-CEDICT (CC BY-SA 4.0) is downloaded only for this run and is not stored or shipped.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "word (explain words), phrase (explain texts) or proof (proof read texts)"
        type: string
        default: "word"
      words:
        description: "Words separated by commas (mode word), or texts separated by | (modes phrase and proof)"
        type: string
        default: "方便,行,了"
      model:
        description: "id:input:output:cached:choice (USD per 1M tokens; choice default|legacy)"
        type: string
        default: "gpt-6-luna:0.10:0.50:0.01:default"
      sentences:
        description: 'Optional JSON object {"word": "sentence it was met in"}'
        type: string
        default: "{}"

concurrency:
  group: explain-try
  cancel-in-progress: false

permissions: {}

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: model-lifecycle
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download CC-CEDICT (this run only)
        run: |
          curl -fsSL -o cedict.txt.gz https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
          gunzip cedict.txt.gz
          wc -l cedict.txt

      - name: Write the explanations
        # The only step that can see the key. It is sent only to api.openai.com and never printed.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODE: ${{ inputs.mode }}
          WORDS: ${{ inputs.words }}
          MODEL: ${{ inputs.model }}
          SENTENCES: ${{ inputs.sentences }}
        run: node scripts/explain-try.mjs --cedict cedict.txt --mode "$MODE" --words "$WORDS" --model "$MODEL" --sentences "$SENTENCES"

      - name: Upload the notes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explain-out
          path: explain-out/
          retention-days: 7
          if-no-files-found: ignore
